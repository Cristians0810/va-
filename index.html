<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>¿Quieres ser mi Valentín? ❤️</title>
    <meta name="description" content="Tengo algo especial que decirte... ✨">
    <meta property="og:title" content="¿Quieres ser mi Valentín? ❤️">
    <meta property="og:description" content="Haz clic para ver la sorpresa que Cristian preparó para ti. 🌹">
    <meta property="og:image" content="https://i.postimg.cc/rsfhbMYs/Whats-App-Image-2026-02-12-at-1-40-02-PM.jpg">
    <meta property="og:url" content="https://cristians0810.github.io/va-/">
    <meta name="theme-color" content="#ff4d6d">

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: #ffdde1; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: 'Arial', sans-serif; overflow: hidden; }
        
        .container { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 400px; position: relative; }
        
        #pantalla-pregunta, #fotos-recuerdo { display: none; width: 100%; }
        #pantalla-inicio { display: block; }

        .foto-portada {
            width: 100%;
            height: 350px; /* Un poco más alta para que se luzca tu foto */
            object-fit: cover;
            border-radius: 15px;
            border: 3px solid #ff4d6d;
            cursor: pointer;
            animation: latido 2s infinite;
        }

        @keyframes latido {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .presentacion {
            position: relative;
            width: 100%;
            height: 450px;
            margin: 15px 0;
            overflow: hidden;
            border-radius: 15px;
            border: 3px solid #ff4d6d;
            background: #f9f9f9;
        }
        .presentacion img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }
        .presentacion img.activa { opacity: 1; }
        
        h1 { color: #d63384; font-size: 20px; margin: 10px 0; }
        .btns { margin-top: 20px; display: flex; justify-content: center; gap: 15px; min-height: 60px; position: relative; }
        
        button { padding: 12px 25px; font-size: 18px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; }
        #btn-si { background-color: #ff4d6d; color: white; z-index: 5; }
        #btn-no { background-color: #888; color: white; position: absolute; transition: 0.1s; z-index: 10; }
    </style>
</head>
<body>

    <div class="container">
        <div id="pantalla-inicio">
            <h1>Tengo una sorpresa para ti... ❤️</h1>
            <img src="https://i.postimg.cc/rsfhbMYs/Whats-App-Image-2026-02-12-at-1-40-02-PM.jpg" class="foto-portada" id="img-entrar">
            <p style="margin-top: 15px; color: #ff4d6d; font-weight: bold;">Toca la foto para descubrirla ✨</p>
        </div>

        <div id="pantalla-pregunta">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp6eXN2bmZ4ZzR6eXN2bmZ4ZzR6eXN2bmZ4ZzR6eXN2bmZ4ZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif" style="width: 120px;">
            <h1>¿Quieres ser mi Valentín? 🌹</h1>
            <div class="btns">
                <button id="btn-si">¡SÍ! 😍</button>
                <button id="btn-no">No 😢</button>
            </div>
        </div>

        <div id="fotos-recuerdo">
            <h1>¡Siiiii! ❤️</h1>
            <div class="presentacion">
                <img src="https://i.postimg.cc/F7jzqJ60/Whats-App-Image-2026-02-12-at-11-15-43-AM.jpg" class="activa">
                <img src="https://i.postimg.cc/fJxyF0Px/Whats-App-Image-2026-02-12-at-11-15-44-AM.jpg">
                <img src="https://i.postimg.cc/svpx8ZLY/Whats-App-Image-2026-02-12-at-11-15-44-AM-1.jpg">
                <img src="https://i.postimg.cc/HVGjBt67/Whats-App-Image-2026-02-12-at-11-15-44-AM-2.jpg">
                <img src="https://i.postimg.cc/crq6XcFY/Whats-App-Image-2026-02-12-at-11-17-22-AM.jpg">
                <img src="https://i.postimg.cc/tY072zBn/Whats-App-Image-2026-02-12-at-11-17-22-AM-1.jpg">
                <img src="https://i.postimg.cc/LndhNVx1/Whats-App-Image-2026-02-12-at-11-17-22-AM-2.jpg">
                <img src="https://i.postimg.cc/XpMXQgsj/Whats-App-Image-2026-02-12-at-11-17-22-AM-3.jpg">
            </div>
            <p id="texto-final" style="color: #ff4d6d; font-weight: bold; font-size: 14px;">Nuestros momentos... ✨</p>
        </div>
    </div>

    <script>
        const pInicio = document.getElementById('pantalla-inicio');
        const imgEntrar = document.getElementById('img-entrar');
        const pPregunta = document.getElementById('pantalla-pregunta');
        const pFotos = document.getElementById('fotos-recuerdo');
        const btnSi = document.getElementById('btn-si');
        const btnNo = document.getElementById('btn-no');
        const fotos = document.querySelectorAll('.presentacion img');

        imgEntrar.addEventListener('click', () => {
            pInicio.style.display = 'none';
            pPregunta.style.display = 'block';
        });

        btnSi.addEventListener('click', () => {
            pPregunta.style.display = 'none';
            pFotos.style.display = 'block';

            let i = 0;
            const intervalo = setInterval(() => {
                fotos[i].classList.remove('activa');
                i++;
                if (i < fotos.length) {
                    fotos[i].classList.add('activa');
                } else {
                    clearInterval(intervalo);
                    document.getElementById('texto-final').innerText = "¡Te amo! Redirigiendo... ❤️";
                    setTimeout(() => {
                        window.location.href = "https://wa.me/525584414112?text=¡Siii!%20Acepto%20ser%20tu%20Valentín%20❤️";
                    }, 1500);
                }
            }, 2500);
        });

        function huye() {
            const x = Math.random() * (window.innerWidth - btnNo.offsetWidth);
            const y = Math.random() * (window.innerHeight - btnNo.offsetHeight);
            btnNo.style.left = x + 'px';
            btnNo.style.top = y + 'px';
        }
        btnNo.addEventListener('mouseover', huye);
        btnNo.addEventListener('touchstart', (e) => { e.preventDefault(); huye(); });
    </script>
</body>
</html>
