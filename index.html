<!DOCTYPE html>

    <meta charset="UTF-8">

    <title>¿Quieres ser mi Valentín? ❤️</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: #ffdde1; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: 'Arial', sans-serif; overflow: hidden; }
        
        .container { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 400px; position: relative; }
        
        #pantalla-pregunta { display: block; }
        #fotos-recuerdo { display: none; width: 100%; }

        /* Estilos de la Presentación */
        .presentacion {
            position: relative;
            width: 100%;
            height: 400px; /* Altura para que las fotos se vean grandes */
            margin: 15px 0;
            overflow: hidden;
            border-radius: 15px;
            border: 3px solid #ff4d6d;
        }
        .presentacion img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        .presentacion img.activa {
            opacity: 1;
        }
        
        h1 { color: #d63384; font-size: 22px; }
        .btns { margin-top: 20px; display: flex; justify-content: center; gap: 15px; min-height: 60px; position: relative; }
        button { padding: 12px 25px; font-size: 18px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; }
        #btn-si { background-color: #ff4d6d; color: white; }
        #btn-no { background-color: #888; color: white; position: absolute; transition: 0.1s; z-index: 1000; }
        #gif-inicial { width: 120px; }
    </style>
</head>
