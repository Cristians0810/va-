<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>¿Quieres ser mi Valentín? ❤️</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: #ffdde1; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: 'Arial', sans-serif; overflow-y: auto; }
        
        .container { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 400px; margin: 20px auto; position: relative; }
        
        #pantalla-pregunta { display: block; }
        #fotos-recuerdo { display: none; width: 100%; }

        /* Cuadrícula de 8 fotos */
        .grid-fotos { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 10px; 
            margin: 20px 0;
        }
        .grid-fotos img { 
            width: 100%; 
            height: 120px; 
            object-fit: cover; 
            border-radius: 10px; 
            border: 2px solid #ff4d6d;
            display: block;
        }
        
        h1 { color: #d63384; font-size: 22px; margin-bottom: 15px; }
        .btns { margin-top: 20px; display: flex; justify-content: center; gap: 15px; min-height: 60px; position: relative; }
        
        button { padding: 12px 25px; font-size: 18px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; }
        #btn-si { background-color: #ff4d6d; color: white; border: 2px solid #ff4d6d; }
        #btn-no { background-color: #888; color: white; position: absolute; transition: 0.1s; z-index: 1000; }
        #gif-inicial { width: 120px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <div id="pantalla-pregunta">
            <img id="gif-inicial" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp6eXN2bmZ4ZzR6eXN2bmZ4ZzR6eXN2bmZ4ZzR6eXN2bmZ4ZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif">
            <h1>¿Quieres ser mi Valentín? 🌹</h1>
            <div class="btns">
                <button id="btn-si">¡SÍ! 😍</button>
                <button id="btn-no">No 😢</button>
            </div>
        </div>

        <div id="fotos-recuerdo">
            <h1>¡Siiiii! ❤️</h1>
            <div class="grid-fotos">
                <img src="https://i.postimg.cc/F7jzqJ60/Whats-App-Image-2026-02-12-at-11-15-43-AM.jpg">
                <img src="https://i.postimg.cc/fJxyF0Px/Whats-App-Image-2026-02-12-at-11-15-44-AM.jpg"]
                <img src="https://i.postimg.cc/HVGjBt67/Whats-App-Image-2026-02-12-at-11-15-44-AM-2.jpg">
                <img src="https://i.postimg.cc/crq6XcFY/Whats-App-Image-2026-02-12-at-11-17-22-AM.jpg">
                <img src="https://i.postimg.cc/tY072zBn/Whats-App-Image-2026-02-12-at-11-17-22-AM-1.jpg">
                <img src="https://i.postimg.cc/LndhNVx1/Whats-App-Image-2026-02-12-at-11-17-22-AM-2.jpg">
                <img src="https://i.postimg.cc/XpMXQgsj/Whats-App-Image-2026-02-12-at-11-17-22-AM-3.jpg">
            </div>
            <p style="font-size: 16px; color: #ff4d6d; font-weight: bold; padding-bottom: 10px;">¡Te quiero muchísimo! ✨</p>
        </div>
    </div>

    <script>
        const btnSi = document.getElementById('btn-si');
        const btnNo = document.getElementById('btn-no');
        const p1 = document.getElementById('pantalla-pregunta');
        const p2 = document.getElementById('fotos-recuerdo');

        // Acción al presionar SÍ
        btnSi.addEventListener('click', () => {
            p1.style.display = 'none';
            p2.style.display = 'block';
            
            // Redirección a WhatsApp después de 8 segundos
            setTimeout(() => {
                const numero = "525584414112"; 
                const mensaje = "¡Siiiii! ¡Claro que quiero ser tu Valentín! ❤️🌹";
                window.location.href = `https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`;
            }, 8000);
        });

        // Función para que el botón NO huya
        function huye() {
            const x = Math.random() * (window.innerWidth - btnNo.offsetWidth);
            const y = Math.random() * (window.innerHeight - btnNo.offsetHeight);
            btnNo.style.position = 'fixed';
            btnNo.style.left = x + 'px';
            btnNo.style.top = y + 'px';
        }

        btnNo.addEventListener('mouseover', huye);
        btnNo.addEventListener('touchstart', (e) => { e.preventDefault(); huye(); });
    </script>
</body>
</html>
