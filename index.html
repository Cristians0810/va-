<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Quieres ser mi Valentín? ❤️</title>
    <style>
        body { background-color: #ffdde1; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: 'Arial', sans-serif; overflow: hidden; }
        .container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); text-align: center; width: 85%; max-width: 350px; position: relative; }
        h1 { color: #d63384; font-size: 22px; margin-bottom: 20px; }
        .btns { margin-top: 20px; display: flex; justify-content: center; gap: 15px; height: 60px; position: relative; }
        button { padding: 10px 25px; font-size: 18px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; }
        #btn-si { background-color: #ff4d6d; color: white; }
        #btn-no { background-color: #888; color: white; position: absolute; transition: 0.1s; z-index: 1000; }
        img { width: 140px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container" id="main-container">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp6eXN2bmZ4ZzR6eXN2bmZ4ZzR6eXN2bmZ4ZzR6eXN2bmZ4ZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif">
        <h1>¿Quieres ser mi Valentín? 🌹</h1>
        <div class="btns">
            <button id="btn-si">¡SÍ! 😍</button>
            <button id="btn-no">No 😢</button>
        </div>
    </div>

    <script>
        const btnSi = document.getElementById('btn-si');
        const btnNo = document.getElementById('btn-no');

        btnSi.addEventListener('click', () => {
            // AQUÍ YA PUSE TU NÚMERO CORRECTO:
            const numero = "525584414112"; 
            const mensaje = "¡Siiiii! ¡Claro que quiero ser tu Valentín! ❤️🌹";
            window.location.href = `https://wa.me/${numero}?text=${encodeURIComponent(mensaje)}`;
        });

        function moverBoton() {
            const x = Math.random() * (window.innerWidth - btnNo.offsetWidth);
            const y = Math.random() * (window.innerHeight - btnNo.offsetHeight);
            btnNo.style.position = 'fixed';
            btnNo.style.left = x + 'px';
            btnNo.style.top = y + 'px';
        }

        btnNo.addEventListener('mouseover', moverBoton);
        btnNo.addEventListener('touchstart', (e) => { e.preventDefault(); moverBoton(); });
    </script>
</body>
</html>
