<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Quieres ser mi Valentín? ❤️</title>
    <style>
        body { background-color: #ffdde1; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: 'Arial', sans-serif; }
        .container { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); text-align: center; width: 85%; max-width: 350px; position: relative; }
        h1 { color: #d63384; font-size: 22px; }
        .btns { margin-top: 20px; display: flex; justify-content: center; gap: 15px; height: 50px; }
        button { padding: 10px 20px; font-size: 16px; border: none; border-radius: 10px; cursor: pointer; z-index: 100; }
        #btn-si { background-color: #ff4d6d; color: white; }
        #btn-no { background-color: #888; color: white; position: absolute; transition: 0.1s; }
        img { width: 120px; }
    </style>
</head>
<body>
    <div class="container" id="main-container">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp6eXN2bmZ4ZzR6eXN2bmZ4ZzR6eXN2bmZ4ZzR6eXN2bmZ4ZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif">
        <h1>¿Quieres ser mi Valentín? 🌹</h1>
        <div class="btns">
            <button id="btn-si">¡SÍ! 😍</button>
            <button id="btn-no">No 😢</button>
        </div>
    </div>

    <script>
        const btnSi = document.getElementById('btn-si');
        const btnNo = document.getElementById('btn-no');
        const container = document.getElementById('main-container');

        btnSi.addEventListener('click', () => {
            // PON TU NÚMERO AQUÍ (Ejemplo: 521234567890)
            const miNumero = "525584414112"; 
            window.location.href = `https://wa.me/${miNumero}?text=¡Siii!%20Acepto%20ser%20tu%20Valentín%20❤️`;
        });

        const moverBoton = () => {
            const containerRect = container.getBoundingClientRect();
            const x = Math.random() * (containerRect.width - btnNo.offsetWidth);
            const y = Math.random() * (containerRect.height - btnNo.offsetHeight);
            btnNo.style.left = x + 'px';
            btnNo.style.top = y + 'px';
        };

        btnNo.addEventListener('mouseover', moverBoton);
        btnNo.addEventListener('touchstart', (e) => { e.preventDefault(); moverBoton(); });
    </script>
</body>
</html>
